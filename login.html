<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Clinical Authentication | GG Doctor Dashboard</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{"primary":"#00497d","error":"#ba1a1a","surface":"#f8fafc"},fontFamily:{headline:["Manrope"],body:["Inter"]}}}}</script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/firebase-service.js"></script>
    <link href="css/output.css" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-100 selection:bg-primary/20">

    <main class="w-full max-w-md p-8 bg-white rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-200">
        
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4 text-primary">
                <span class="material-symbols-outlined text-3xl">health_and_safety</span>
            </div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tight font-headline">Provider Access</h1>
            <p class="text-sm text-slate-500 font-medium mt-2">GG Doctor Dashboard RPM System</p>
        </div>

        <div class="space-y-5">
            <div id="error-message" class="hidden text-error text-xs font-bold mt-2 text-center bg-red-50 p-3 rounded-lg border border-red-100 animate-pulse"></div>

            <button id="google-login-btn" class="w-full bg-white text-slate-700 font-bold py-4 rounded-xl mt-4 border border-slate-300 hover:bg-slate-50 hover:shadow-sm transition-all active:scale-[0.98] flex items-center justify-center gap-3">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> Sign In with Google Workspace
            </button>
        </div>

        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <p class="text-xs text-slate-400 font-medium">Authorized Clinical Personnel Only</p>
        </div>
    </main>

    <script>
        document.getElementById('google-login-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error-message');
            errorEl.classList.add('hidden');

            const btn = e.target.closest('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Authenticating...';

            const result = await window.firebaseService.login();
            if (result.success) {
                window.location.href = 'index.html';
            } else {
                btn.disabled = false;
                btn.innerHTML = originalText;
                errorEl.innerText = result.error || 'Authentication failed.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
